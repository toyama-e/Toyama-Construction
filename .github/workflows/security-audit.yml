name: Dependency security audit

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Monday 09:30 JST. Scheduled workflows run on the default branch (main).
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Prepare reports
        run: mkdir -p audit-reports
      - name: Audit all dependencies (fail on High or Critical)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --include=dev --audit-level=high --json > audit-reports/all.json
      - name: Audit production dependencies (fail on High or Critical)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high --json > audit-reports/production.json
      - name: Summarize both audits
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          {
            echo '## Dependency security audit'
            echo ''
            echo 'High/Critical fails either audit. Lower severities remain visible and require review.'
            echo 'Counts include affected parent packages; they are not counts of unique vulnerabilities.'
            echo ''
            echo '| Scope | Critical | High | Moderate | Low | Info | Total |'
            echo '| --- | ---: | ---: | ---: | ---: | ---: | ---: |'
          } >> "$GITHUB_STEP_SUMMARY"
          for scope in all production; do
            report="audit-reports/$scope.json"
            if ! jq -e '.auditReportVersion == 2 and (.error == null) and (.metadata.vulnerabilities | type == "object")' "$report" > /dev/null; then
              echo "::error::Invalid or missing audit report: $scope. Check the audit step and JSON artifact."
              exit 1
            fi
            jq -r --arg scope "$scope" '.metadata.vulnerabilities | "| \($scope) | \(.critical) | \(.high) | \(.moderate) | \(.low) | \(.info) | \(.total) |"' "$report" >> "$GITHUB_STEP_SUMMARY"
            if jq -e '.metadata.vulnerabilities.total > 0' "$report" > /dev/null; then
              echo "::warning::Vulnerabilities found in $scope dependencies. Review the JSON artifact and docs/security-operations.md."
            fi
          done
          {
            echo ''
            echo 'See the audit-reports artifact for every package, severity, dependency chain and Advisory URL.'
            echo 'Production dependency scope does not itself prove public HTTP exploitability.'
            echo 'Known minimatch finding: https://github.com/toyama-e/Toyama-Construction/issues/70 (not suppressed).'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save audit reports even on failure
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-reports
          path: audit-reports/*.json
          if-no-files-found: error
          retention-days: 14
